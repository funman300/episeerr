services:
  episeerr:
    # Image is built by GitHub Actions and pushed to GHCR (public).
    # Pinned to an immutable commit tag on purpose, not :latest, so restarts
    # are deterministic. Bump this tag when you want a newer CI build:
    #   push to main -> Actions builds -> set the new sha-/b<n> tag here ->
    #   docker compose pull && docker compose up -d
    image: ghcr.io/funman300/episeerr:sha-619bacc
    container_name: episeerr
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - TZ=Etc/UTC
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./data:/app/data
      - ./temp:/app/temp
    networks:
      - traefik-proxy

# Episeerr shares the arr stack's Docker network so it can resolve `sonarr`
# etc. by hostname. Create/rename to match your stack if different.
networks:
  traefik-proxy:
    external: true
