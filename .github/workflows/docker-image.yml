name: Build and push Docker image

# Builds the Episeerr image in GitHub's cloud and pushes it to the GitHub
# Container Registry (GHCR) so the host can `docker compose pull` instead of
# building locally. Runs on every push to main and on manual dispatch.
#
# The image is built exactly once and smoke-tested on the runner before
# anything is pushed. The same local image that passed the smoke test is then
# tagged and pushed under each computed tag — there is no second build, so a
# cache miss can never publish different bits than what was tested. Consumers
# pin immutable sha-/b<n> tags, so a broken image that reaches GHCR cannot be
# withdrawn, only superseded — the gate has to come first.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'runbook.md'
      - 'docs/**'
      - 'docker-compose.yml'   # deployment ref, does not affect the image
  workflow_dispatch: {}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write        # push to ghcr.io/<owner>/<repo> with GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read VERSION
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=raw,value=b${{ github.run_number }}
            type=raw,value=${{ steps.ver.outputs.version }}-b${{ github.run_number }}

      - name: Build candidate image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: episeerr:candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test candidate
        run: .github/scripts/smoke-test.sh episeerr:candidate episeerr-candidate

      - name: Tag and push the tested image
        run: |
          set -euo pipefail
          mapfile -t TAGS <<< "${{ steps.meta.outputs.tags }}"
          # Push immutable tags first and any mutable "latest" tag last, so a
          # partial-push failure can never leave "latest" pointing at a build
          # whose immutable sha-/b<n> aliases were never published.
          ORDERED_TAGS=()
          LATEST_TAGS=()
          for tag in "${TAGS[@]}"; do
            [ -n "$tag" ] || continue
            case "$tag" in
              *:latest) LATEST_TAGS+=("$tag") ;;
              *) ORDERED_TAGS+=("$tag") ;;
            esac
          done
          ORDERED_TAGS+=("${LATEST_TAGS[@]}")
          for tag in "${ORDERED_TAGS[@]}"; do
            [ -n "$tag" ] || continue
            docker tag episeerr:candidate "$tag"
            docker push "$tag"
            echo "pushed $tag"
          done

      - name: Summary
        run: |
          {
            echo "### Image pushed to GHCR"
            echo ""
            echo "Pinnable tags for this build:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Pull on the host with:"
            echo '```'
            echo "docker compose pull && docker compose up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
